services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-sapiens}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-sapiens_pass}
      POSTGRES_DB: ${POSTGRES_DB:-sapiens_klick}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-sapiens} -d ${POSTGRES_DB:-sapiens_klick}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-sapiens}:${POSTGRES_PASSWORD:-sapiens_pass}@db:5432/${POSTGRES_DB:-sapiens_klick}
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
    ports:
      - "8000:8000"

  frontend:
    build: ./frontend
    ports:
      - "8080:80"
    depends_on:
      - backend

volumes:
  postgres_data: