    <style>
      /* Splash inline (antes de que cargue el CSS externo) */
      #splash {
        position: fixed;
        inset: 0;
        background: radial-gradient(1200px 600px at 50% 50%, #1a0f0a 0%, #0e0604 100%);
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.2rem;
        z-index: 10000;
        transition: opacity 0.5s ease;
      }
      #splash.splash-hidden {
        opacity: 0;
        pointer-events: none;
      }
      .splash-mark {
        width: 100px;
        height: 100px;
        border-radius: 50%;
        background: radial-gradient(circle at 30% 30%, #f1d79c, #d4a95a);
        box-shadow: 0 0 60px rgba(212, 169, 90, 0.6);
        animation: splashPulse 1.8s ease-in-out infinite;
      }
      @keyframes splashPulse {
        0%, 100% { transform: scale(1); box-shadow: 0 0 60px rgba(212, 169, 90, 0.6); }
        50% { transform: scale(1.08); box-shadow: 0 0 90px rgba(212, 169, 90, 0.8); }
      }
      .splash-title {
        font-family: Georgia, serif;
        font-size: 2rem;
        font-weight: 700;
        letter-spacing: 4px;
        color: #d4a95a;
        text-shadow: 0 0 20px rgba(212, 169, 90, 0.4);
      }
      .splash-sub {
        color: #6b5544;
        font-family: system-ui, sans-serif;
        font-size: 0.85rem;
        letter-spacing: 3px;
        text-transform: uppercase;
      }
    </style>
  </head>
  <body>
    <div id="splash">
      <div class="splash-mark"></div>
      <div class="splash-title">URUKAIS KLICK</div>
      <div class="splash-sub">Tierras Oscuras</div>
    </div>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
